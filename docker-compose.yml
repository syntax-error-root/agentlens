services:
  postgres:
    image: postgres:16-alpine
    container_name: agentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agentlens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agentlens}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentlens-internal

  redis:
    image: redis:7-alpine
    container_name: agentlens-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agentlens-internal

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-28Z
    container_name: agentlens-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - agentlens-internal

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
    container_name: agentlens-api
    restart: unless-stopped
    environment:
      API_BIND_ADDR: "0.0.0.0:8080"
      OTLP_HTTP_BIND_ADDR: "0.0.0.0:4318"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentlens}"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: "production"
    ports:
      - "8080:8080"
      - "4318:4318"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentlens-internal

  worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.worker
    container_name: agentlens-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agentlens}"
      REDIS_URL: "redis://redis:6379"
      APP_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agentlens-internal

  dashboard:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.dashboard
    container_name: agentlens-dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://api:8080"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - agentlens-internal

networks:
  agentlens-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
